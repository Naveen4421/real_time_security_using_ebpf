services:
  backend:
    build:
      context: ./app/backend
    container_name: security-demo-backend
    ports:
      - "5000:5000"
    networks:
      - secure-net
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
    container_name: security-demo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - secure-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - secure-net
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - secure-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - secure-net
    depends_on:
      - loki
    restart: unless-stopped

  ml-agent:
    build:
      context: ./ml_pipeline
    container_name: ml-security-agent
    networks:
      - secure-net
    restart: unless-stopped

networks:
  secure-net:
    driver: bridge
