# Helm values for the falco chart. Falcosidekick addresses are set by
# setup/03-install-stack.sh (collector URL depends on the node IP).
driver:
  kind: modern_ebpf
tty: true
falco:
  json_output: true
falcosidekick:
  enabled: true
  config:
    talon:
      checkcert: false
customRules:
  eval-rules.yaml: |-
    - rule: Shell Spawned in Eval Backend
      desc: A shell process starts in the eval backend container
      condition: >
        spawned_process and
        proc.name in (shell_binaries) and
        k8s.ns.name = "eval" and
        container.name = "backend"
      output: >
        Shell spawned in eval backend (command=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [eval]

    - rule: Sensitive Path Open in Eval Backend
      desc: open/openat/openat2 on /etc/shadow or /bin/hack in the eval backend, successful or not
      condition: >
        evt.type in (open, openat, openat2) and
        k8s.ns.name = "eval" and
        container.name = "backend" and
        fd.name in (/etc/shadow, /bin/hack)
      output: >
        Sensitive path open in eval backend (file=%fd.name res=%evt.res pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: CRITICAL
      tags: [eval]
